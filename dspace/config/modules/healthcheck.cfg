### Healthcheck module config

# You can configure which module should be used during healthcheck.
# Names must match plugin.named below.
# If you use the Pre-DSpace-3.0 embargo feature, you might want to
# add 'Embargo items (Pre-3.0),' to the following list.
healthcheck.checks = General Information,\
    Item summary,\
    User summary,\
    License summary,\
    Embargo check,\
    Metadata check,\
    VLO harvest,\
    Link checker

plugin.named.org.dspace.health.Check = \
    org.dspace.health.InfoCheck =                     General Information,\
    org.dspace.health.ChecksumCheck =                 Checksum,\
    org.dspace.health.EmbargoCheck =                  Embargo items (Pre-3.0),\
    org.dspace.health.EmbargoInfoCheck =              Embargo check,\
    org.dspace.health.ItemCheck =                     Item summary,\
    org.dspace.health.UserCheck =                     User summary,\
    org.dspace.health.LogAnalyserCheck =              Log Analyser Check,\
    org.dspace.health.LicenseCheck =                  License summary,\
    org.dspace.health.MetadataCheck =                 Metadata check,\
    org.dspace.health.VloHarvestCheck =               VLO harvest,\
    org.dspace.health.LinkCheckerCheck =              Link checker

# default value of the report from the last N days (where dates are applicable)
healthcheck.last_n_days = 7

### CLARIN provider checks ("VLO harvest", "Link checker")
# Name of this repository as a metadata provider in the CLARIN infrastructure, i.e. the endpoint name in the
# VLO OAI harvester (https://vlo.clarin.eu/oai-harvest-viewer/) and the collection name in the CLARIN
# link checker (https://curation.clarin.eu/linkchecker), e.g.
# LINDAT_CLARIAH_CZ_digital_library_at_the_Institute_of_Formal_and_Applied_Linguistics_UFAL_
# When empty, both checks only report that they are not configured and make no network calls.
healthcheck.clarin.provider.name =
# Connect/read timeout (ms) for requests to the CLARIN services
#healthcheck.clarin.http.timeout = 30000

# OAI harvest viewer API and harvest data (logs) of the VLO harvester
#healthcheck.vlo.api.url = https://vlo.clarin.eu/oai-harvest-viewer/api
#healthcheck.vlo.data.url = https://vlo.clarin.eu/data
# Warn when the last harvest of our endpoint is older than this (CLARIN centres are harvested twice a week)
#healthcheck.vlo.max-harvest-age-days = 7

# CLARIN Curation Dashboard hosting the link checker results
#healthcheck.linkchecker.url = https://curation.clarin.eu
# Only list broken links whose URL matches this regular expression (e.g. links to your own hosts,
# which you can fix); all broken links are listed when empty. The counts always include all links.
# Avoid backslashes and commas in the value (both are special in DSpace configuration), use [.] etc.
#healthcheck.linkchecker.broken.url-filter = ^https?://[^/]*cuni[.]cz
# Maximum number of broken links listed in the report
#healthcheck.linkchecker.broken.max-to-show = 50
